<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: system-ui; padding: 15px; background: #0f172a; color: white; }
    textarea { width: 100%; height: 80px; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #1e293b; color: white; border: 1px solid #334155; }
    button { width: 100%; background: #6366f1; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #result { margin-top: 15px; font-size: 12px; }
  </style>
</head>
<body>
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
    <h3 style="margin:0; color:#6366f1;">XIST AI SCANNER</h3>
  </div>
  <textarea id="scanInput" placeholder="Paste text or URL here..."></textarea>
  <button id="scanBtn">Run Forensic Scan</button>
  <div id="result"></div>
  
  <script src="popup.js"></script>
</body>
</html>
